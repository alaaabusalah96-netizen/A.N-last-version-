# Free trial deployment (test data only). Secrets are entered in the Render dashboard, never stored here.
services:
  - type: web
    name: an-erp-trial
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
