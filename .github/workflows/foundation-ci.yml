name: Foundation CI

on:
  push:
    branches: [main, master, '**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: an_test
          POSTGRES_PASSWORD: an_test_pass
          POSTGRES_DB: an_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Run Database Migrations
        run: npm run migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"

      - name: Provision App DB Role
        run: npm run db:provision-app-role
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          APP_DB_PASSWORD: AppRoleSecurePass123!
          APP_DB_USER: an_app

      - name: Run Foundation Test Battery
        id: battery
        run: npm run test:foundation
        env:
          DATABASE_URL: postgresql://an_app:AppRoleSecurePass123!@localhost:5432/an_foundation
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"
          CI: "true"
          ENABLE_TENANT_DEMO: "1"
          CSRF_SECRET: test_csrf_secret_minimum_32_chars_long_key_for_ci
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          PLATFORM_ADMIN_USERNAME: ci_admin
          PLATFORM_ADMIN_PASSWORD: CiAdminSecurePass123!
          SESSION_TTL_HOURS: "12"
          SESSION_COOKIE_NAME: an_session

      - name: Upload Test Battery Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-test-results
          path: |
            foundation-test-report.json
            foundation-battery.log
          retention-days: 7
