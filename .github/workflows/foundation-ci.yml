name: Foundation CI

on:
  push:
    branches: [main, master, '**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: an_test
          POSTGRES_PASSWORD: an_test_pass
          POSTGRES_DB: an_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_SSL: disable

      - name: Bootstrap stub Supabase roles (anon, authenticated)
        run: npm run ci:bootstrap-roles
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          DATABASE_SSL: disable
          NODE_ENV: test

      - name: Run Database Migrations
        run: npm run migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"
          DATABASE_SSL: disable

      - name: Simulate Managed PG / Data API Guard Prep
        run: npm run ci:simulate-managed-pg
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          DATABASE_SSL: disable

      - name: Provision App DB Role
        run: npm run db:provision-app-role
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          APP_DB_PASSWORD: AppRoleSecurePass123!
          APP_DB_USER: an_app
          NODE_ENV: test
          DATABASE_SSL: disable

      - name: Verify Migration Checksums (AN-MIGRATION-CHECKSUMS-1)
        run: npm run test:migration-checksums-1
        env:
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          DATABASE_URL: postgresql://an_app:AppRoleSecurePass123!@localhost:5432/an_foundation
          APP_DB_USER: an_app
          NODE_ENV: test
          REQUIRE_DB: "1"
          DATABASE_SSL: disable

      - name: PostgreSQL Integration Proof (T1-T7 strict)
        run: npm run test:pg-proof-2
        env:
          AN_PG_PROOF_STRICT: "1"
          AN_PG_PROOF_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          CI: "true"
          DATABASE_SSL: disable

      - name: PostgreSQL Integration Smoke (AN-PG-SMOKE-LIVE-CI-1)
        run: npm run test:pg-smoke-1
        env:
          SMOKE_ALLOW_DISPOSABLE: "1"
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          DATABASE_URL: postgresql://an_app:AppRoleSecurePass123!@localhost:5432/an_foundation
          NODE_ENV: test
          CI: "true"
          DATABASE_SSL: disable

      - name: Verify C2 HTTP User-Admin Proof (AN-C2-HTTP-PROOF-1)
        run: npm run test:c2-http-proof-1
        env:
          DATABASE_URL: postgresql://an_app:AppRoleSecurePass123!@localhost:5432/an_foundation
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"
          CI: "true"
          DATABASE_SSL: disable
          C2_ALLOW_DISPOSABLE: "1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Foundation Test Battery
        id: battery
        run: npm run test:foundation
        env:
          DATABASE_URL: postgresql://an_app:AppRoleSecurePass123!@localhost:5432/an_foundation
          MIGRATION_DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"
          CI: "true"
          DATABASE_SSL: disable
          ENABLE_TENANT_DEMO: "1"
          CSRF_SECRET: test_csrf_secret_minimum_32_chars_long_key_for_ci
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          PLATFORM_ADMIN_USERNAME: ci_admin
          PLATFORM_ADMIN_PASSWORD: CiAdminSecurePass123!
          SESSION_TTL_HOURS: "12"
          SESSION_COOKIE_NAME: an_session

      - name: Publish Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f .test-reports/summary.md ]; then
            cat .test-reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Battery Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-test-results
          path: .test-reports/
          retention-days: 7

  promote-last-green:
    needs: foundation
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update last-green tag
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -f last-green
          git push -f origin last-green
