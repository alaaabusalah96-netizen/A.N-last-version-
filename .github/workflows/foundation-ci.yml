name: Foundation CI

on:
  push:
    branches: [main, master, '**']
  pull_request:
    branches: [main, master]

jobs:
  foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: an_test
          POSTGRES_PASSWORD: an_test_pass
          POSTGRES_DB: an_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Run Database Migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"

      - name: Run Foundation Test Battery
        run: npm run test:foundation
        env:
          DATABASE_URL: postgresql://an_test:an_test_pass@localhost:5432/an_foundation
          NODE_ENV: test
          REQUIRE_DB: "1"
          PLATFORM_ADMIN_USERNAME: ci_admin
          PLATFORM_ADMIN_PASSWORD: CiAdminSecurePass123!
          SESSION_TTL_HOURS: 12
          SESSION_COOKIE_NAME: an_session
